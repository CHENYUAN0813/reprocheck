<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReproCheck Notes</title>
<style>body{font:18px system-ui;background:#101821;color:#e9eff4;max-width:760px;margin:8vh auto;padding:24px}label{display:block}input,button{font:inherit;padding:12px;margin:12px 0;border-radius:8px}button{background:#98ddbe}li{padding:16px;border-bottom:1px solid #526273}small{color:#aab8c8}</style>
<main><small>REPROCHECK · FULL-STACK ACCEPTANCE FIXTURE</small><h1>Persistent notes</h1>
<p>JavaScript form → TypeScript HTTP API → SQLite database.</p>
<form><label for="note">Note</label><input id="note" required maxlength="200"><button>Add note</button></form>
<p role="status"></p><ul aria-label="Saved notes"></ul></main>
<script type="module">
const status = document.querySelector('[role=status]');
async function load() {
  const response = await fetch('/api/notes');
  if (!response.ok) throw new Error('Could not load notes');
  const notes = await response.json();
  document.querySelector('ul').replaceChildren(...notes.map(note => {
    const item = document.createElement('li'); item.textContent = note.text; return item;
  }));
}
document.querySelector('form').addEventListener('submit', async event => {
  event.preventDefault();
  try {
    const response = await fetch('/api/notes', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:document.querySelector('input').value})});
    if (!response.ok) throw new Error('Could not save note');
    await load(); document.querySelector('input').value = ''; status.textContent = 'Saved';
  } catch (error) { status.textContent = error.message; }
});
load().catch(error => { status.textContent = error.message; });
</script></html>
